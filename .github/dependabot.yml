# Dependabot keeps the GitHub Actions (pinned by commit, with the version in a
# comment) and the Python dependencies in uv.lock up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development
    commit-message:
      prefix: deps
