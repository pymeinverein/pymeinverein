[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymeinverein"
dynamic = ["version"]
description = "Async Python client for the (unofficial) WISO MeinVerein Web API"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Klaas Weyermann" }]
keywords = ["meinverein", "wiso", "buhl", "verein", "club", "api", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.11",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pymeinverein"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "AGENTS.md", "CHANGELOG.md", "LICENSE", "mkdocs.yml"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: runs against the real meinverein.de API (needs MEINVEREIN_EMAIL / MEINVEREIN_PASSWORD)",
]

[tool.coverage.run]
source = ["pymeinverein"]
